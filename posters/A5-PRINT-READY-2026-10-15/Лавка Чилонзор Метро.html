  2. Replace https://qr.sirnayalavka.uz/450e28 with the actual voting URL
     Example: https://sirnayalavka.uz/aviasozlar
  3. Print: File → Print → Paper size A5, Margins: None, Scale: Fit to page
-->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Poster — KAAS СЫРНАЯ ЛАВКА</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Manrope:wght@500;700;800&family=Noto+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #e9e8e4;
      color: #111;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .poster {
      --brand: #F46F00;
      --brand-deep: #b35000;
      --ink: #0f0f10;
      --paper: #ffffff;
      --muted: #6a6a72;
      --hairline: #e6e6e2;

      width: 148mm;
      height: 210mm;
      background: var(--paper);
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(10,10,10,0.10), 0 2px 6px rgba(10,10,10,0.04);
      flex-shrink: 0;
    }

    /* в”Ђв”Ђ TOP COLOR BLOCK (78mm) в”Ђв”Ђ */
    .top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 78mm;
      background: var(--brand);
      color: #fff;
      padding: 13mm 12mm 0;
      overflow: hidden;
    }

    .top::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 80% at 85% 0%, rgba(255,255,255,0.10), transparent 55%);
      pointer-events: none;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Noto Sans', 'Manrope', 'Inter', sans-serif;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 10.5px;
      position: relative;
      z-index: 1;
    }

    .brand-row .right {
      opacity: 0.85;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .stars {
      margin-top: 8mm;
      font-size: 38px;
      letter-spacing: 7px;
      line-height: 1;
      position: relative;
      z-index: 1;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .headline {
      margin-top: 7mm;
      font-family: 'Noto Sans', 'Manrope', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 34px;
      line-height: 1.0;
      letter-spacing: -0.025em;
      position: relative;
      z-index: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .headline-sub {
      margin-top: 3mm;
      font-family: 'Manrope', sans-serif;
      font-weight: 500;
      font-size: 13px;
      line-height: 1.25;
      letter-spacing: 0.005em;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    /* в”Ђв”Ђ QR CARD в”Ђв”Ђ */
    .qr-card {
      position: absolute;
      left: 50%;
      top: 81mm;
      transform: translateX(-50%);
      width: 104mm;
      height: 104mm;
      background: #fff;
      border-radius: 4mm;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.04),
        0 14px 32px rgba(0,0,0,0.12),
        0 2px 6px rgba(0,0,0,0.06);
      padding: 4mm;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-inner {
      position: relative;
      width: 96mm;
      height: 96mm;
    }

    .qr-inner::before,
    .qr-inner::after,
    .qr-inner > .crop-tr,
    .qr-inner > .crop-bl {
      content: '';
      position: absolute;
      width: 7mm;
      height: 7mm;
      border: 1.6px solid var(--brand);
    }
    .qr-inner::before  { top: -2.5mm;    left: -2.5mm;  border-right: 0; border-bottom: 0; }
    .qr-inner::after   { bottom: -2.5mm; right: -2.5mm; border-left: 0;  border-top: 0; }
    .qr-inner > .crop-tr { top: -2.5mm;    right: -2.5mm; border-left: 0;  border-bottom: 0; }
    .qr-inner > .crop-bl { bottom: -2.5mm; left: -2.5mm;  border-right: 0; border-top: 0; }

    .qr-code {
      width: 96mm;
      height: 96mm;
      display: block;
    }

    /* в”Ђв”Ђ BOTTOM STACK в”Ђв”Ђ */
    .bottom-stack {
      position: absolute;
      left: 12mm;
      right: 12mm;
      top: 188mm;
      bottom: 5mm;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2.5mm;
    }

    .instructions {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1mm;
    }

    .instruction {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .instruction .arrow {
      color: var(--brand);
      font-weight: 800;
      margin-right: 4px;
    }

    .instruction-uz {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 10.5px;
      letter-spacing: 0.01em;
      color: var(--muted);
    }

    /* в”Ђв”Ђ FOOTER в”Ђв”Ђ */
    .footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Manrope', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .footer .site {
      color: var(--muted);
      font-weight: 600;
    }

    .footer .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.1em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* в”Ђв”Ђ PRINT в”Ђв”Ђ */
    @page { size: A5 portrait; margin: 0; }
    @media print {
      body { background: #fff; padding: 0; display: block; }
      .poster { box-shadow: none; margin: 0; page-break-after: always; break-after: page; }
    }
  </style>
</head>
