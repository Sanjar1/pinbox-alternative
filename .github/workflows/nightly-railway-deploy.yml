name: Nightly Railway Deploy

# Deploys the latest `main` to the Railway `web` service every night, from a
# cloud runner — so it no longer depends on the laptop being awake or the local
# `railway up` surviving the "Indexing..." step.
#
# TIMING / PEAK-HOURS:
#   Railway free-tier deploys to EU West (europe-west4) are BLOCKED during peak
#   hours: 08:00–20:00 Europe/Amsterdam. GitHub cron is always UTC (no DST).
#   We run at 02:00 UTC = 07:00 Asia/Tashkent = 03:00 (summer) / 04:00 (winter)
#   Amsterdam — comfortably OFF-PEAK in every season, and ~1h before the 03:00
#   UTC daily Telegram report so that report runs on freshly-deployed code.
#   (Previously 18:05 UTC, which was inside peak in winter.)
on:
  schedule:
    - cron: '0 2 * * *'
  # Manual trigger from the Actions UI ("Run workflow"). Use this to deploy on
  # demand (it will still be refused by Railway if you click it during peak).
  workflow_dispatch:

concurrency:
  group: nightly-railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web service to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Log trigger context
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "==== Nightly Railway Deploy ===="
          echo "Triggered by : $EVENT   (schedule = automatic cron, workflow_dispatch = manual)"
          echo "Time (UTC)   : $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "Time (Tashkent): $(TZ=Asia/Tashkent date +'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u -d '+5 hours' +'%Y-%m-%d %H:%M:%S')"
          echo "Branch / SHA : $REF_NAME @ $SHA"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (service=web, env=production)
        # Run from the REPO ROOT (not app/). The Railway service has
        # Root Directory = "app", so it expects the uploaded snapshot to contain
        # an app/ subdirectory and cd's into it for the build context. Uploading
        # from app/ produces a snapshot with no app/ subdir -> build fails with
        # "lstat .../snapshot-target-unpack/app: no such file or directory".
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] starting railway up (service=web) from repo root"
          railway up --service web --ci
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] railway up finished"
