name: Nightly Railway Deploy

# Deploys the latest `main` to the Railway `web` service every night, from a
# cloud runner — so it no longer depends on the laptop being awake or the local
# `railway up` surviving the "Indexing..." step.
#
# TIMING / PEAK-HOURS:
#   Railway free-tier deploys to EU West (europe-west4) are BLOCKED during peak
#   hours: 08:00–20:00 Europe/Amsterdam = 06:00–18:00 UTC (summer) / 07:00–19:00
#   UTC (winter). A deploy attempted in that window is rejected instantly.
#
#   GOTCHA (2026-06-08): GitHub does NOT run scheduled crons on time — under load
#   they drift by HOURS. Our old '0 2 * * *' (02:00 UTC, meant to be off-peak)
#   was actually firing ~06:40 UTC, landing INSIDE the summer peak window, so
#   every nightly deploy was rejected and prod kept serving stale code.
#
#   FIX: fire at 20:00 UTC — the very start of the off-peak window (22:00
#   Amsterdam summer / 21:00 winter). This gives ~10h of GitHub-delay tolerance
#   before peak resumes at 06:00 UTC, and still lands well before the 01:23 UTC
#   daily Telegram report, so that report runs on freshly-deployed code.
#   If a deploy is ever urgent during peak, the only options are to wait for
#   off-peak or upgrade the Railway plan (peak block is a free-tier limit).
on:
  schedule:
    # THREE off-peak attempts for resilience against GitHub cron drift/skips —
    # runs entirely on GitHub's cloud runners, so the director's PC can be off.
    # All three are off-peak year-round (summer peak 06:00–18:00 UTC, winter
    # 07:00–19:00 UTC) and land before the 01:23 UTC daily Telegram report, so
    # prod is fresh for it. Re-deploying the same commit is idempotent/harmless;
    # with three spread tries a skipped or drifted run is almost always caught.
    - cron: '0 20 * * *'   # 20:00 UTC = 01:00 Tashkent — primary (start of off-peak)
    - cron: '30 21 * * *'  # 21:30 UTC = 02:30 Tashkent — mid backup
    - cron: '0 23 * * *'   # 23:00 UTC = 04:00 Tashkent — late backup
  # Manual trigger from the Actions UI ("Run workflow"). Use this to deploy on
  # demand (it will still be refused by Railway if you click it during peak).
  workflow_dispatch:

concurrency:
  group: nightly-railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web service to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Log trigger context
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "==== Nightly Railway Deploy ===="
          echo "Triggered by : $EVENT   (schedule = automatic cron, workflow_dispatch = manual)"
          echo "Time (UTC)   : $(date -u +'%Y-%m-%d %H:%M:%S')"
          echo "Time (Tashkent): $(TZ=Asia/Tashkent date +'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u -d '+5 hours' +'%Y-%m-%d %H:%M:%S')"
          echo "Branch / SHA : $REF_NAME @ $SHA"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Guard frozen QR slugs against migration DDL
        # HARD RULE (docs/QR_SLUG_PROTECTION.md): 41 printed posters depend on
        # QRCode.slug values. Migrations run automatically on deploy since
        # 2026-07-05, so any NEW migration touching QRCode/slug must be blocked
        # unless a human explicitly marks it reviewed. 0_init is exempt: it is
        # baselined (recorded as applied) and its SQL never executes in prod.
        run: |
          violations=""
          for f in $(find app/prisma/migrations -name migration.sql -not -path '*/0_init/*'); do
            if grep -qEi 'qrcode|[^a-z]slug' "$f" && ! grep -q 'ALLOW-QRCODE-REVIEWED' "$f"; then
              violations="$violations $f"
            fi
          done
          if [ -n "$violations" ]; then
            echo "::error::Migration touches QRCode/slug without ALLOW-QRCODE-REVIEWED marker:$violations"
            echo "Frozen-slug rule: see docs/QR_SLUG_PROTECTION.md. If this DDL is genuinely safe,"
            echo "add a comment line '-- ALLOW-QRCODE-REVIEWED: <why>' to the migration after review."
            exit 1
          fi
          echo "slug guard OK: no unreviewed QRCode/slug DDL in migrations"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (service=web, env=production)
        # Run from the REPO ROOT (not app/). The Railway service has
        # Root Directory = "app", so it expects the uploaded snapshot to contain
        # an app/ subdirectory and cd's into it for the build context. Uploading
        # from app/ produces a snapshot with no app/ subdir -> build fails with
        # "lstat .../snapshot-target-unpack/app: no such file or directory".
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] starting railway up (service=web) from repo root"
          railway up --service web --ci
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] railway up finished"
