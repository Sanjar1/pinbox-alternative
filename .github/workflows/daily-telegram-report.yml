name: Daily Telegram Report

on:
  schedule:
    # Primary: nominal 01:23 UTC = 06:23 Tashkent (UTC+5). GitHub uses UTC for
    # cron. We deliberately use an odd non-`:00` minute at an unpopular UTC
    # hour: GitHub Actions delays `:00` crons at popular hours (e.g. the old
    # 03:00/04:00 UTC slots) by 3.5-5h under load, which pushed the report to
    # ~12:00-13:30 Tashkent instead of the target ~08:00 Tashkent. Odd-minute
    # crons at quieter hours drift far less, so this run should land near
    # 08:00 Tashkent.
    # D-031 constraint: the report covers the previous FULL Tashkent day, so
    # the run must start after Tashkent midnight = after 19:00 UTC of the
    # previous UTC day. 01:23 UTC clears that by ~6h of margin.
    - cron: '23 1 * * *'
    # Backup: nominal 02:23 UTC = 07:23 Tashkent — covers nights when GitHub
    # skips or heavily delays the primary cron. Same odd-minute/quiet-hour
    # reasoning as above, and same D-031 margin (satisfied with ~7h to spare).
    # The dedup step below makes sure the report is still sent AT MOST ONCE
    # per day, whichever attempt runs first.
    - cron: '23 2 * * *'
  # Also allows manual trigger from the GitHub Actions UI ("Run workflow" button).
  workflow_dispatch:

# Prevent two scheduled runs from overlapping if one is slow.
# cancel-in-progress: false ensures a slow run is never killed mid-flight.
concurrency:
  group: daily-telegram-report
  cancel-in-progress: false

# Needed by the dedup step to list today's runs of this workflow.
permissions:
  actions: read

jobs:
  send-report:
    name: Send Daily Telegram Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The report endpoint is NOT idempotent (it posts straight to Telegram),
      # so with two schedules we must skip if a successful run already happened
      # today. Manual "Run workflow" clicks always send (explicit human intent).
      # On any API error we default to SENDING — a rare duplicate beats a
      # silently missing report.
      - name: Skip if already sent today (scheduled runs only)
        id: dedup
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%F)
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-telegram-report.yml/runs?status=success&created=${TODAY}&exclude_pull_requests=true" --jq '.total_count' 2>/dev/null || echo 0)
          echo "Successful runs already today: ${COUNT}"
          if [ "${COUNT}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report already sent today — skipping this backup attempt."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: POST /api/admin/sync-managers (best-effort)
        if: steps.dedup.outputs.skip != 'true'
        continue-on-error: true
        run: |
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] sync managers"
          curl --fail-with-body -sS \
            --retry 2 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.REPORTS_API_KEY }}" \
            https://web-production-370c1.up.railway.app/api/admin/sync-managers
          echo

      - name: POST /api/reports/daily
        if: steps.dedup.outputs.skip != 'true'
        run: |
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] starting POST /api/reports/daily"
          # No --retry-all-errors here: the endpoint is NOT idempotent (it sends
          # Telegram messages before responding), so retrying an HTTP 5xx or a
          # timeout after a partial send duplicates the report in the chat.
          # --retry only re-attempts transient connection failures (no request sent).
          # --max-time 180 covers Railway cold start + multi-part Telegram sends.
          curl --fail-with-body -sS \
            --retry 3 --retry-delay 30 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.REPORTS_API_KEY }}" \
            https://web-production-370c1.up.railway.app/api/reports/daily
          echo
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] done"
