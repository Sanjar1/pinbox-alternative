name: Daily Telegram Report

on:
  schedule:
    # 03:00 UTC = 08:00 Tashkent (UTC+5). GitHub uses UTC for cron.
    - cron: '0 3 * * *'
  # Also allows manual trigger from the GitHub Actions UI ("Run workflow" button).
  workflow_dispatch:

# Prevent two scheduled runs from overlapping if one is slow.
# cancel-in-progress: false ensures a slow run is never killed mid-flight.
concurrency:
  group: daily-telegram-report
  cancel-in-progress: false

jobs:
  send-report:
    name: Send Daily Telegram Report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: POST /api/admin/sync-managers (best-effort)
        continue-on-error: true
        run: |
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] sync managers"
          curl --fail-with-body -sS \
            --retry 2 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.REPORTS_API_KEY }}" \
            https://web-production-370c1.up.railway.app/api/admin/sync-managers
          echo

      - name: POST /api/reports/daily
        run: |
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] starting POST /api/reports/daily"
          # No --retry-all-errors here: the endpoint is NOT idempotent (it sends
          # Telegram messages before responding), so retrying an HTTP 5xx or a
          # timeout after a partial send duplicates the report in the chat.
          # --retry only re-attempts transient connection failures (no request sent).
          # --max-time 180 covers Railway cold start + multi-part Telegram sends.
          curl --fail-with-body -sS \
            --retry 3 --retry-delay 30 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.REPORTS_API_KEY }}" \
            https://web-production-370c1.up.railway.app/api/reports/daily
          echo
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S UTC')] done"
